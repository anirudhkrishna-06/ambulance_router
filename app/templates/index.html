<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chennai Ambulance Routing</title>
    
    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
    
    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-sA+G4h1dV0tID3bJbG+0O4XB6g/5WtdJjxuxUyj6pNk=" 
        crossorigin=""
    />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
        }
        #map {
            height: 80vh;
            width: 100%;
        }
        .controls {
            margin: 10px;
        }
        .info-panel {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h2 class="mt-2 mb-2">Chennai Ambulance Routing</h2>
        
        <div class="row controls">
            <div class="col-md-4">
                <label for="startNode">Start Location:</label>
                <select id="startNode" class="form-select">
                    <option value="">Select Start Node</option>
                    <!-- Options populated by map.js -->
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button id="findRouteBtn" class="btn btn-primary w-100">Find Route</button>
            </div>
        </div>
        
        <div id="map"></div>
        
        <div class="row info-panel">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Route Info</h5>
                        <p id="distance">Distance: N/A</p>
                        <p id="eta">ETA: N/A</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-p+Qj/mV3v+GjBLGf3+R2X1sCr2Kp9S/5bI1N9bLwT1M=" 
        crossorigin="">
    </script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
</body>
</html>
