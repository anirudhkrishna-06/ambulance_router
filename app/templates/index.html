 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ambulance Routing - Test</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href=".././static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <div>
        <header>
            <div>
                <i class="fas fa-ambulance"></i>
                Chennai Ambulance Emergency Router
            </div>
        </header>
        <main>
            <aside>
                <div>
                    <h2><i class="fas fa-route"></i> Route Finder</h2>
                    <label for="startNodeSearch">
                        <i class="fas fa-map-marker-alt"></i>
                        Emergency Location
                    </label>
                    <div class="search-container">
                        <input type="text" id="startNodeSearch" placeholder="Search location or click on map...">
                        <div id="suggestions" class="suggestions"></div>
                    </div>

                    <button id="findRouteBtn">
                        <i class="fas fa-hospital"></i> Find Nearest Hospital
                    </button>
                </div>
                <div>
                    <div id="map"></div>
                    <div id="infoPanel" class="info-panel">
                        <div>
                            <i class="fas fa-hospital"></i>
                            <span id="hospitalName">Route Information</span>
                        </div>
                        <div>
                            <span id="distanceValue">0</span> km |
                            <span id="etaValue">0</span> mins
                        </div>
                    </div>
                </div>
            </aside>
        </main>
    </div>

<div class="controls">
    <label for="startNode">Start Node ID:</label>
    <input type="number" id="startNode" value="1" min="1">
    <button id="findRouteBtn">Find Nearest Hospital</button>
</div>

<div id="map"></div>
<div class="info-panel">
    <p id="routeInfo">Route Info: N/A</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const map = L.map('map').setView([13.0827, 80.2707], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routeLayer = null;
    let startMarker = null;
    let hospitalMarker = null;
    let allNode = [];
    let selectedStartNodeId = null;

    const hospitalIcon = L.divIcon({
        html: '<i class="fas fa-hospital" style="color:#dc2626; font-size:18px;"></i>',
        iconSize: [20, 20], className: 'custom-div-icon'
    });
    const locationIcon = L.divIcon({
        html: '<i class="fas fa-map-marker-alt" style="color:#3b82f6; font-size:16px;"></i>',
        iconSize: [20, 20], className: 'custom-div-icon'
    });
    const emergencyIcon = L.divIcon({
        html: '<i class="fas fa-ambulance" style="color:#ef4444; font-size:20px;"></i>',
        iconSize: [25, 25], className: 'custom-div-icon'
    });

    axios.get('/api/get_map_data')
        .then(res => {
            allNodes = res.data.nodes;
            allNodes.forEach(node => {
                const icon = node.type == 'hospital' ? hospitalIcon : locationIcon;
                L.marker([node.lat, node.lon], { icon }).addTo(map).bindPopup(`<h6>${node.name}</h6>`);
            })  
        })
        .catch(err => {
            console.error(err);
        });

        
    document.getElementById('findRouteBtn').addEventListener('click', async () => {
        const startNode = parseInt(document.getElementById('startNode').value);
        if (!startNode) return alert('Enter a valid start node ID');

        try {
            const res = await axios.post('/api/find_nearest_hospital', { start_node: startNode });
            const data = res.data;
            if (routeLayer) map.removeLayer(routeLayer);
            if (startMarker) map.removeLayer(startMarker);
            if (hospitalMarker) map.removeLayer(hospitalMarker);

            const latlngs = data.path.map(p => [p.lat, p.lng]);
            routeLayer = L.polyline(latlngs, { color: 'red', weight: 5 }).addTo(map);
            map.fitBounds(routeLayer.getBounds());

            // Add start marker
            startMarker = L.marker(latlngs[0])
                .addTo(map)
                .bindPopup(`Start: ${data.path_names[0]}`)
                .openPopup();

            // Add hospital marker
            hospitalMarker = L.marker(latlngs[latlngs.length - 1], {
                icon: L.icon({
                    iconUrl: hospitalIcon, // put a hospital icon here
                    iconSize: [30, 30]
                })
            })
            .addTo(map)
            .bindPopup(`Hospital: ${data.path_names[data.path_names.length - 1]}`)
            .openPopup();
            document.getElementById('routeInfo').textContent =
                `Nearest Hospital: ${data.path_names[data.path_names.length-1]} | Distance: ${data.distance} km | ETA: ${data.eta} mins`;

        } catch (err) {
            console.error(err);
            alert('Failed to find route. Check backend or node ID.');
        }
    });
</script>
</body>
</html>
