<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chennai Ambulance Router - Emergency Response System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="brand">
                    <i class="fas fa-ambulance brand-icon"></i>
                    <span class="brand-text">Chennai Emergency Router</span>
                </div>
                <div class="emergency-badge">
                    <i class="fas fa-phone-alt"></i>
                    <span>Emergency: 108</span>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2 class="sidebar-title">
                        <i class="fas fa-route"></i>
                        Route Finder
                    </h2>
                    <p class="sidebar-description">Locate the nearest hospital for emergency medical assistance</p>
                </div>

                <div class="search-section">
                    <div class="form-group">
                        <label for="startNodeSearch" class="form-label">
                            <i class="fas fa-map-marker-alt"></i>
                            Emergency Location
                        </label>
                        <div class="search-container">
                            <div class="search-input-wrapper">
                                <i class="fas fa-search search-icon"></i>
                                <input 
                                    type="text" 
                                    id="startNodeSearch" 
                                    class="search-input"
                                    placeholder="Search location or click on map..."
                                    autocomplete="off"
                                >
                                <div id="suggestions" class="suggestions"></div>
                            </div>
                        </div>
                    </div>

                    <button id="findRouteBtn" class="find-route-btn">
                        <i class="fas fa-hospital"></i>
                        <span>Find Nearest Hospital</span>
                    </button>
                </div>

                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span class="status-text">System Online</span>
                </div>
            </aside>

            <div class="map-section">
                <div class="map-container">
                    <div id="map" class="map"></div>
                    
                    <div id="infoPanel" class="info-panel">
                        <div class="info-header">
                            <div class="info-icon">
                                <i class="fas fa-hospital"></i>
                            </div>
                            <div class="info-title">
                                <div id="hospitalName" class="hospital-name">Route Information</div>
                                <div class="route-status">Emergency Route Active</div>
                            </div>
                        </div>
                        <div class="info-stats">
                            <div class="stat-item">
                                <span id="distanceValue" class="stat-value">0</span>
                                <span class="stat-label">Distance (km)</span>
                            </div>
                            <div class="stat-divider"></div>
                            <div class="stat-item">
                                <span id="etaValue" class="stat-value">0</span>
                                <span class="stat-label">ETA (mins)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: false
        }).setView([13.0827, 80.2707], 12);

        L.control.zoom({
            position: 'topright'
        }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let routeLayer = null;
        let startMarker = null;
        let hospitalMarker = null;
        let allNodes = [];
        let selectedStartNodeId = null;

        const hospitalIcon = L.divIcon({
            html: '<i class="fas fa-hospital" style="color: #dc2626; font-size: 18px;"></i>',
            iconSize: [20, 20],
            className: 'custom-div-icon'
        });

        const locationIcon = L.divIcon({
            html: '<i class="fas fa-map-marker-alt" style="color: #4f46e5; font-size: 16px;"></i>',
            iconSize: [20, 20],
            className: 'custom-div-icon'
        });

        const emergencyIcon = L.divIcon({
            html: '<i class="fas fa-ambulance" style="color: #dc2626; font-size: 20px;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        axios.get('/api/get_map_data')
            .then(res => {
                allNodes = res.data.nodes;
                console.log('Loaded nodes:', allNodes.length);

                allNodes.forEach(node => {
                    const icon = node.type === 'hospital' ? hospitalIcon : locationIcon;
                    const color = node.type === 'hospital' ? '#dc2626' : '#4f46e5';
                    
                    L.marker([node.lat, node.lon], { icon })
                        .addTo(map)
                        .bindPopup(`
                            <div style="text-align: center;">
                                <strong>${node.name}</strong><br>
                                <span style="color: ${color}; text-transform: capitalize;">
                                    ${node.type === 'hospital' ? 'Hospital' : 'Location'}
                                </span>
                            </div>
                        `);
                });
            })
            .catch(err => {
                console.error('Failed to load nodes:', err);
                showNotification('Failed to load map data', 'error');
            });

        const searchInput = document.getElementById('startNodeSearch');
        const suggestionsDiv = document.getElementById('suggestions');

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            suggestionsDiv.innerHTML = '';

            if (query.length === 0) {
                suggestionsDiv.classList.remove('show');
                return;
            }

            const matches = allNodes.filter(node => 
                node.name.toLowerCase().includes(query)
            );

            if (matches.length > 0) {
                suggestionsDiv.classList.add('show');
                matches.slice(0, 8).forEach(node => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `
                        <i class="fas ${node.type === 'hospital' ? 'fa-hospital' : 'fa-map-marker-alt'}" 
                           style="color: ${node.type === 'hospital' ? '#dc2626' : '#4f46e5'}"></i>
                        <span>${node.name}</span>
                    `;
                    div.addEventListener('click', () => {
                        selectLocation(node);
                        suggestionsDiv.classList.remove('show');
                    });
                    suggestionsDiv.appendChild(div);
                });
            } else {
                suggestionsDiv.classList.remove('show');
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                suggestionsDiv.classList.remove('show');
            }
        });

        function selectLocation(node) {
            selectedStartNodeId = node.id;
            searchInput.value = node.name;

            if (startMarker) map.removeLayer(startMarker);

            startMarker = L.marker([node.lat, node.lon], { icon: emergencyIcon })
                .addTo(map)
                .bindPopup(`
                    <div style="text-align: center;">
                        <strong>Emergency Location</strong><br>
                        ${node.name}
                    </div>
                `)
                .openPopup();

            map.setView([node.lat, node.lon], 14);
        }

        function getNearestNode(lat, lng) {
            let nearestNode = null;
            let minDist = Infinity;

            allNodes.forEach(node => {
                const dLat = node.lat - lat;
                const dLng = node.lon - lng;
                const dist = Math.sqrt(dLat*dLat + dLng*dLng);
                if (dist < minDist) {
                    minDist = dist;
                    nearestNode = node;
                }
            });

            return nearestNode;
        }

        map.on('click', e => {
            const { lat, lng } = e.latlng;
            const nearestNode = getNearestNode(lat, lng);
            if (!nearestNode) return;

            selectLocation(nearestNode);
        });

        const findRouteBtn = document.getElementById('findRouteBtn');
        const infoPanel = document.getElementById('infoPanel');

        findRouteBtn.addEventListener('click', async () => {
            if (!selectedStartNodeId) {
                showNotification('Please select a valid emergency location first', 'warning');
                return;
            }

            const originalContent = findRouteBtn.innerHTML;
            findRouteBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Finding Route...</span>';
            findRouteBtn.disabled = true;

            try {
                const res = await axios.post('/api/find_nearest_hospital', { 
                    start_node: selectedStartNodeId 
                });
                const data = res.data;

                if (routeLayer) map.removeLayer(routeLayer);
                if (hospitalMarker) map.removeLayer(hospitalMarker);

                const latlngs = data.path.map(p => [p.lat, p.lng]);
                routeLayer = L.polyline(latlngs, {
                    color: '#dc2626',
                    weight: 4,
                    opacity: 0.8
                }).addTo(map);

                map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
                const hospitalLatLng = latlngs[latlngs.length - 1];
                hospitalMarker = L.marker(hospitalLatLng, { icon: hospitalIcon })
                    .addTo(map)
                    .bindPopup(`
                        <div style="text-align: center;">
                            <strong>${data.path_names[data.path_names.length-1]}</strong><br>
                        </div>
                    `)
                    .openPopup();

                updateInfoPanel(data);
                showNotification('Route found successfully!', 'success');

            } catch (err) {
                console.error(err);
                showNotification('Failed to find route. Please try again.', 'error');
            } finally {
                findRouteBtn.innerHTML = originalContent;
                findRouteBtn.disabled = false;
            }
        });

        function updateInfoPanel(data) {
            const hospitalName = data.path_names[data.path_names.length - 1];
            
            document.getElementById('hospitalName').textContent = hospitalName;
            document.getElementById('distanceValue').textContent = data.distance;
            document.getElementById('etaValue').textContent = data.eta;
            
            infoPanel.classList.add('show');
        }

        function showNotification(message, type = 'info') {
            alert(message);
        }

        console.log('🚨 Chennai Emergency Router initialized');
    </script>
</body>
</html>
